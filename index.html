<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Magical Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
html{color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:#f3e9da;color:#3a2a20;font-family:'Noto Sans TC',sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:40px 20px 64px}
.eyebrow{display:inline-block;background:#d2ac86;color:#2f2016;font-weight:700;font-size:16px;padding:6px 16px;border-radius:999px;margin:0 0 16px}
h1{font-family:'Chiron GoRound TC','Noto Sans TC',sans-serif;font-weight:800;font-size:44px;line-height:1.15;margin:0 0 12px}
.sub{font-size:20px;color:#735d4d;margin:0 0 36px}
.card{display:block;text-decoration:none;color:inherit;background:#fbf6ee;border:2px solid #dcc9b0;border-radius:24px;padding:28px 28px 24px;margin:0 0 20px}
.card:hover,.card:focus-visible{border-color:#6b4128}
.card .tag{font-size:16px;font-weight:700;color:#6b4128;margin:0 0 6px}
.card h2{font-family:'Chiron GoRound TC','Noto Sans TC',sans-serif;font-size:32px;margin:0 0 8px}
.card p{font-size:20px;margin:0 0 16px;color:#5a4535}
.go{display:block;background:#6b4128;color:#fff8ee;text-align:center;font-weight:700;font-size:22px;padding:16px;border-radius:16px}
.tip{font-size:18px;color:#735d4d;margin:32px 0 0}
</style>
</head>
<body>
<main>
<p class="eyebrow">OathWoven</p>
<h1>Magical Playground</h1>
<p class="sub">用 Claude 一起做出來的小工具，點一下就能玩。</p>

<a class="card" href="hungry-gacha/">
<p class="tag">範例 1</p>
<h2>今天吃什麼</h2>
<p>不知道要吃什麼嗎？按一下，幫你決定。</p>
<span class="go">打開來玩</span>
</a>

<a class="card" href="prompt-cards/">
<p class="tag">教學</p>
<h2>學員專屬提示詞小卡</h2>
<p>照著做，一步一步做出自己的小工具。每一句都能一鍵複製。</p>
<span class="go">打開來看</span>
</a>

<p class="tip">小提醒：用手機打開後，可以用瀏覽器的「加入主畫面」，變成桌面上的小圖示。</p>
</main>
</body>
</html>
